name: Build Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: astrum-agent-runtime

jobs:
  build:
    name: Build and push ${{ matrix.flavor }} image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, lite]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          date_tag="$(date -u +'%Y%m%d')"
          short_sha="${GITHUB_SHA::7}"
          image="ghcr.io/${owner}/${IMAGE_NAME}"
          version_tag="${date_tag}-${short_sha}"

          if [ "${{ matrix.flavor }}" = "full" ]; then
            stable_tags=$'latest\nfull'
          else
            stable_tags='lite'
          fi

          {
            echo "image=${image}"
            echo "version_tag=${version_tag}"
            echo 'stable_tags<<EOF'
            printf '%s\n' "${stable_tags}"
            echo 'EOF'
            echo 'push_tags<<EOF'
            while IFS= read -r stable_tag; do
              [ -n "${stable_tag}" ] || continue
              printf '%s:%s\n' "${image}" "${stable_tag}"
            done <<< "${stable_tags}"
            printf '%s:%s-%s\n' "${image}" "${{ matrix.flavor }}" "${version_tag}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.flavor }} candidate with attestations
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            RUNTIME_FLAVOR=${{ matrix.flavor }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.image }}:verify-${{ matrix.flavor }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.description=AI agent runtime optimized for general tasks (${{ matrix.flavor }})
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version_tag }}
          cache-from: type=gha,scope=push-${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=push-${{ matrix.flavor }}

      - name: Verify ${{ matrix.flavor }} runtime from pushed digest
        run: |
          docker pull "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"
          docker tag "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}" "${{ steps.meta.outputs.image }}:verify-${{ matrix.flavor }}"
          docker run --rm "${{ steps.meta.outputs.image }}:verify-${{ matrix.flavor }}" verify-runtime

      - name: Promote verified ${{ matrix.flavor }} digest to version tags
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version_tag }}" \
            "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"

      - name: Promote verified ${{ matrix.flavor }} digest to stable tags
        run: |
          tags="${{ steps.meta.outputs.push_tags }}"
          args=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            args="$args --tag $tag"
          done <<< "$tags"
          # shellcheck disable=SC2086
          docker buildx imagetools create $args "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a
        with:
          cosign-release: v2.4.3

      - name: Sign ${{ matrix.flavor }} image
        env:
          COSIGN_YES: true
        run: |
          cosign sign "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"
